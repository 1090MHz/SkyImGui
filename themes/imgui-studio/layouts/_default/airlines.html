{{ define "main" }}
<div class="airlines-preview-container">
    <header class="airlines-header">
        <h1>✈️ Airline Themes Gallery</h1>
        <p>{{ .Content }}</p>
        <nav class="airlines-nav">
            <a href="/" class="btn-back">← Back to Theme Studio</a>
        </nav>
    </header>

    <div class="airlines-grid" id="airlines-grid">
        <div class="loading">Loading airline themes...</div>
    </div>
</div>

<script src="{{ "js/airline-colors.js" | relURL }}?v=1"></script>
<script>
// Load and parse CSV client-side
fetch('/data/csv/airline_brand_colors_all.csv')
    .then(response => response.text())
    .then(csvText => {
        const lines = csvText.trim().split('\n');
        const airlines = [];
        
        // Skip header row
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            // Parse CSV line accounting for quoted values with multiple formats
            // Format: "Airline","color1, color2" or Airline,"color1, color2"
            const commaIndex = line.indexOf(',');
            if (commaIndex === -1) continue;
            
            const airline = line.substring(0, commaIndex).replace(/"/g, '');
            const colorsStr = line.substring(commaIndex + 1).replace(/^"|"$/g, '').replace(/""/g, '"');
            const colors = colorsStr.split(',').map(c => c.trim().replace(/"/g, ''));
            
            if (airline && colors.length > 0 && colors[0]) {
                airlines.push({ airline, colors });
            }
        }
        
        // Sort airlines alphabetically by name
        airlines.sort((a, b) => a.airline.localeCompare(b.airline));
        
        console.log(`Loaded ${airlines.length} airlines`);
        renderAirlines(airlines);
    })
    .catch(error => {
        console.error('Error loading airlines:', error);
        document.getElementById('airlines-grid').innerHTML = '<div class="error">Failed to load airline themes</div>';
    });

function renderAirlines(airlines) {
    const grid = document.getElementById('airlines-grid');
    grid.innerHTML = airlines.map(({ airline, colors }) => {
        const themeColors = getAirlineThemeColors(colors);
        const primaryColor = themeColors[0] || '#4296f9';
        const secondaryColor = themeColors[1] || primaryColor;
        const tertiaryColor = themeColors[2] || secondaryColor;
        const quaternaryColor = themeColors[3] || tertiaryColor;
        const colorSwatches = colors.map(color => 
            `<span class="color-swatch" style="background-color: ${color};" title="${color}"></span>`
        ).join('');
        
        return `
        <div class="airline-card" data-airline="${airline}" data-primary="${primaryColor}" data-secondary="${secondaryColor}" data-tertiary="${tertiaryColor}" data-quaternary="${quaternaryColor}">
            <div class="airline-card-header">
                <h3>${airline}</h3>
                <div class="airline-colors">
                    ${colorSwatches}
                </div>
            </div>
            
            <div class="airline-preview">
                <div class="preview-window" style="--primary: ${primaryColor}; --secondary: ${secondaryColor}; --tertiary: ${tertiaryColor}; --quaternary: ${quaternaryColor};">
                    <div class="preview-titlebar">${airline} Theme</div>
                    <div class="preview-content">
                        <div class="preview-button">Button</div>
                        <div class="preview-input">Input Field</div>
                        <div class="preview-tab-bar">
                            <div class="preview-tab active">Tab 1</div>
                            <div class="preview-tab">Tab 2</div>
                        </div>
                        <div class="preview-table">
                            <div class="preview-table-header">Header</div>
                            <div class="preview-table-row">Row 1</div>
                            <div class="preview-table-row alt">Row 2</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="airline-card-footer">
                <button class="btn-apply" onclick="applyAirlineTheme('${airline}', '${primaryColor}', '${secondaryColor}', '${tertiaryColor}', '${quaternaryColor}')">
                    Apply Theme
                </button>
            </div>
        </div>
        `;
    }).join('');
}

function applyAirlineTheme(airline, primaryColor, secondaryColor, tertiaryColor, quaternaryColor) {
    const card = [...document.querySelectorAll('.airline-card')]
        .find(candidate => candidate.dataset.airline === airline);
    const brandColors = card
        ? [...card.querySelectorAll('.color-swatch')].map(swatch => swatch.title)
        : [];

    // Save to session storage and redirect to main page
    const theme = {
        airline,
        brandColors,
        primaryColor,
        secondaryColor,
        tertiaryColor
    };
    
    // Only include quaternary and beyond if they're different from tertiary (i.e., airline has that many colors)
    if (quaternaryColor && quaternaryColor !== tertiaryColor) {
        theme.quaternaryColor = quaternaryColor;
    }
    
    sessionStorage.setItem('applyTheme', JSON.stringify(theme));
    window.location.href = '/';
}
</script>

<style>

    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
    background: #0a0a0a;
    min-height: 100vh;

    text-align: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.airlines-header h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: #fff;
}

.airlines-nav {
    margin-top: 1.5rem;
}

.btn-back {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: rgba(66, 150, 249, 0.2);
    color: #4296f9;
    text-decoration: none;
    border-radius: 4px;
    border: 1px solid rgba(66, 150, 249, 0.3);
    transition: all 0.2s;
}

.btn-back:hover {
    background: rgba(66, 150, 249, 0.3);
    border-color: rgba(66, 150, 249, 0.5);
}

    text-align: center;
    padding: 3rem;
    font-size: 1.2rem;
    color: #999;
}

    color: #ff6b6b;
}

.airlines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 2rem;
    margin-top: 2rem;
}

.airline-card {
    background: #1a1a1a;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 1.5rem;
    transition: all 0.3s;
}

    border-color: rgba(66, 150, 249, 0.4);
    box-shadow: 0 4px 12px rgba(66, 150, 249, 0.2);
    transform: translateY(-2px);
}

.airline-card-header {
    margin-bottom: 1rem;
}

.airline-card-header h3 {
    margin: 0 0 0.75rem 0;
    font-size: 1.25rem;
    color: #fff;
}

.airline-colors {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: transform 0.2s;
}

.color-swatch:hover {
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.4);
}

}

.preview-window {
    background: #0f0f0f;

    border-radius: 4px;

}

.preview-titlebar {
    background: color-mix(in srgb, var(--primary, #4296f9) 80%, #000000);
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
}

.preview-content {
    padding: 1rem;
}

.preview-button {
    background: color-mix(in srgb, var(--secondary, #4296f9) 40%, transparent);

    padding: 0.5rem 1rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    text-align: center;
}

.preview-input {
    background: color-mix(in srgb, var(--tertiary, #4296f9) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--tertiary, #4296f9) 30%, transparent);
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    color: #999;
}

.preview-tab-bar {
    display: flex;

}

.preview-tab {
    padding: 0.4rem 0.75rem;
    font-size: 0.875rem;

    color: #999;
}

.preview-tab.active {
    background: color-mix(in srgb, var(--tertiary, #4296f9) 60%, #2a2a2a);
    color: #fff;
}

.preview-table {
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;

}

.preview-table-header {
    background: color-mix(in srgb, var(--quaternary, var(--tertiary, #4296f9)) 80%, #0a0a0a);

    font-size: 0.875rem;

.airline-card-footer {
    margin-top: 1rem;
    display: flex;
    gap: 0.5rem;
}

.btn-apply {
    flex: 1;
    padding: 0.75rem;
    background: rgba(66, 150, 249, 0.4);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.875rem;
    cursor: pointer;

</style>
